name: TicketDesk CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Enforce least-privilege permissions across the entire workflow
permissions:
  contents: read

# Automatically cancel redundant in-progress runs on the same branch or PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Job 1: Application Test Suite & Lambda Operational Validation
  # ============================================================================
  python-ci:
    name: Python Test & Lambda Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "app/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run Python unit test suite (44 tests)
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover tests -v

      - name: Run Lambda operational validation (10 checks)
        run: |
          python scripts/validate_lambda_operations.py

  # ============================================================================
  # Job 2: Terraform Infrastructure Code Verification
  # ============================================================================
  terraform-ci:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Verify Terraform formatting
        run: terraform fmt -check -diff

      - name: Initialize Terraform (offline, no cloud backend)
        run: terraform init -backend=false

      - name: Validate Terraform configuration
        run: terraform validate
